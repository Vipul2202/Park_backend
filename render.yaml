# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: park-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Render generates these once and keeps them stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # sync: false → Render prompts for these at deploy time and never
      # stores them in the repo.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: PLATFORM_COMMISSION_PCT
        value: "15"
      - key: GST_PCT
        value: "18"
      - key: PLATFORM_FEE_FLAT
        value: "15"

      # Browser origins for the admin dashboard. The native app sends no
      # Origin header, so it is allowed regardless of this list.
      - key: CORS_ORIGINS
        sync: false
